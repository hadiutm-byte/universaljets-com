name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check for Claude credentials
        id: auth
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set, so the Claude step is skipped. Create one with 'claude setup-token' and add it under Settings > Secrets and variables > Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Automatic PR Review
        if: steps.auth.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a comprehensive code review focusing on:
            1. Code quality, readability, and best practices
            2. Security vulnerabilities and input validation
            3. Performance bottlenecks
            4. Test coverage and edge cases
            5. Documentation

            Provide inline comments for specific issues and top-level comments for general observations.
          claude_args: |
            --model claude-sonnet-4-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
