name: Deploy Supabase Edge Functions

# Manual only. Never runs on push. Requires repository secret SUPABASE_ACCESS_TOKEN
# (Supabase Dashboard → Account → Access Tokens). Project ref comes from
# supabase/config.toml and can be overridden via the input below.
on:
  workflow_dispatch:
    inputs:
      function:
        description: "Function name to deploy (leave empty to deploy all)"
        required: false
        default: "aviapages-charter-search"
      project_ref:
        description: "Supabase project ref (defaults to supabase/config.toml)"
        required: false
        default: ""
      supabase_token:
        description: "One-off Supabase access token (optional; falls back to the SUPABASE_ACCESS_TOKEN secret). Revoke after use."
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SECRET_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      INPUT_TOKEN: ${{ github.event.inputs.supabase_token }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Resolve project ref
        id: ref
        run: |
          REF="${{ github.event.inputs.project_ref }}"
          if [ -z "$REF" ]; then
            REF=$(sed -n 's/^project_id *= *"\(.*\)"/\1/p' supabase/config.toml)
          fi
          [ -n "$REF" ] || { echo "No project ref found"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - name: Prepare token
        run: |
          RAW="$INPUT_TOKEN"
          [ -n "$RAW" ] || RAW="$SECRET_TOKEN"
          [ -n "$RAW" ] || { echo "No token provided (neither the supabase_token input nor the SUPABASE_ACCESS_TOKEN secret is set)"; exit 1; }
          TOKEN=$(printf '%s' "$RAW" | tr -d '[:space:]')
          echo "::add-mask::$TOKEN"
          echo "SUPABASE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          case "$TOKEN" in
            sbp_*) echo "Token prefix OK (length ${#TOKEN})";;
            *) echo "Token does not start with sbp_ after trimming (length ${#TOKEN})"; exit 1;;
          esac
      - name: Diagnose token access
        continue-on-error: true
        run: |
          echo "=== Projects this token can see ==="
          supabase projects list || echo "(projects list failed)"
          echo "=== Looking for target ref ${{ steps.ref.outputs.ref }} ==="
          supabase projects list 2>/dev/null | grep -F "${{ steps.ref.outputs.ref }}" && echo "TARGET PROJECT IS VISIBLE" || echo "TARGET PROJECT NOT VISIBLE TO THIS TOKEN"
      - name: Deploy
        run: |
          FN="${{ github.event.inputs.function }}"
          if [ -n "$FN" ]; then
            supabase functions deploy "$FN" --project-ref "${{ steps.ref.outputs.ref }}" --yes
          else
            supabase functions deploy --project-ref "${{ steps.ref.outputs.ref }}" --yes
          fi
