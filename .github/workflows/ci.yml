name: CI

# Build and test only. Production deploys are handled by Cloudflare Workers Builds
# on pushes to main (bun install, bun run build, wrangler deploy). This workflow
# needs no secrets and never deploys.
on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
      - run: npm test
